function formatVersesWithNumbers(text){let lines=text.split('\n'); let html=""; lines.forEach((line,i)=>{if(!line.trim()) return; let num=i+1; let arNum=num.toLocaleString('ar-EG'); html+="<div style='display:flex;gap:8px;margin-bottom:10px;align-items:flex-start'><span class='verse-num'>"+arNum+"</span><span style='flex:1'>"+line.trim()+" <span style='color:#16a34a'>﴿"+arNum+"﴾</span></span></div>";}); return html;}
function formatFrWithNumbers(text){let lines=text.split('\n'); let html=""; lines.forEach(l=>{if(!l.trim()) return; html+="<div style='margin-bottom:6px'>"+l.trim()+"</div>";}); return html;}

function prevS(){let s=document.getElementById('surahSel'); if(s.selectedIndex>0){s.selectedIndex--; loadS();}}
function nextS(){let s=document.getElementById('surahSel'); if(s.selectedIndex<s.options.length-1){s.selectedIndex++; loadS();}}
function playS(){let id=document.getElementById('surahSel').value||1; let a=document.getElementById('coranA'); a.src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/"+id+".mp3"; a.play().catch(()=>alert("Audio besoin internet"));}
function playAdhan(){let a=document.getElementById('adhanAudio'); a.src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/1.mp3"; a.style.display='block'; a.play();}
function newHadith(){let h=hadithsFull[Math.floor(Math.random()*hadithsFull.length)]; document.getElementById('hadithContent').innerHTML="<div class='verse-ar'>"+h.ar+"</div><div style='font-weight:700;margin-top:8px'>"+h.fr+"</div><div style='margin-top:8px'><span class='badge' style='background:#fef3c7;color:#92400e'>"+h.src+"</span></div>"; window._last=h;}
function speakHadith(){if(window._last) speakText(window._last.ar,'ar',0.7);}
function renderDuas(){let c=document.getElementById('duasContent'); c.innerHTML=""; allDuasFull.forEach(d=>{c.innerHTML+="<div style='border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:10px;background:#fff'><div style='display:flex;justify-content:space-between'><b style='color:#7c3aed'>#"+d.id+" "+d.cat+"</b><span class='small'>"+d.src+"</span></div><div class='verse-ar' style='font-size:22px;margin-top:6px'>"+d.ar+"</div><div style='font-weight:700;margin-top:6px'>"+d.fr+"</div><div class='small' style='color:#2563eb'>"+d.ph+"</div><div style='display:flex;gap:8px;margin-top:10px'><button class='btn btn-small btn-gold' onclick='speakText(\""+d.ar+"\",\"ar\",0.7)'>Arabe</button><button class='btn btn-small' style='background:#f1f5f9' onclick='speakText(\""+d.fr+"\",\"fr\",0.9)'>Français</button></div></div>";});}
function filterDuas(){let q=document.getElementById('duaSearch').value.toLowerCase(); document.querySelectorAll('#duasContent > div').forEach(el=>{el.style.display=el.innerText.toLowerCase().includes(q)?'block':'none';});}
function renderLetters(){let c=document.getElementById('arabicLetters'); c.innerHTML=""; lettersFull.forEach(l=>{c.innerHTML+="<div class='letter-card' onclick='playLetterSound(\""+l.a+"\",\""+l.n+"\")'><div class='letter-ar'>"+l.a+"</div><div style='font-weight:900;font-size:12px'>"+l.n+"</div><div class='small'>"+l.t+" Son</div></div>";});}
function playLetterSound(ar,name){speakText(ar,'ar',0.6); if(navigator.vibrate) navigator.vibrate(50);}
function startLetterGame(){let target=lettersFull[Math.floor(Math.random()*lettersFull.length)]; letterGameTarget=target; document.getElementById('letterGameQ').innerHTML="<div class='small'>Trouve:</div><div style='font-size:12px;font-weight:800;color:#16a34a'>"+target.n+"</div><div style='font-size:48px;cursor:pointer' onclick='playLetterSound(\""+target.a+"\",\""+target.n+"\")'>"+target.a+" 🔊</div>"; let opts=[target]; while(opts.length<4){let r=lettersFull[Math.floor(Math.random()*lettersFull.length)]; if(!opts.find(o=>o.a==r.a)) opts.push(r);} opts.sort(()=>Math.random()-0.5); document.getElementById('letterGameOpts').innerHTML=opts.map(o=>"<button class='letter-card' onclick='checkLetterGame(\""+o.a+"\",\""+o.n+"\")'><div style='font-size:32px'>"+o.a+"</div><div style='font-size:10px;font-weight:800'>"+o.n+"</div></button>").join(''); setTimeout(()=>playLetterSound(target.a,target.n),300);}
function checkLetterGame(chosen,name){if(chosen==letterGameTarget.a){letterGameScore++; document.getElementById('letterGameScore').innerText="Score: "+letterGameScore+" Correct: "+name; if(navigator.vibrate) navigator.vibrate(80); speakText("Correct "+name,'fr',0.9); setTimeout(startLetterGame,1000);} else{if(navigator.vibrate) navigator.vibrate([50,50,50]); document.getElementById('letterGameScore').innerText="Score: "+letterGameScore+" - Cherche "+letterGameTarget.n;}}
function setTasbihMode(mode){tasbihMode=mode; let phases={subhan:"SubhanAllah (33)",hamd:"Alhamdulillah (33)",akbar:"Allahu Akbar (34)",tahlil:"La ilaha illAllah"}; document.getElementById('tasbihPhase').innerText="Phase: "+(phases[mode]||mode); if(navigator.vibrate) navigator.vibrate(30);}
function doTasbih(){tasbihTotal++; if(tasbihMode=='subhan'){subhan++; if(subhan>=33){tasbihMode='hamd'; document.getElementById('tasbihPhase').innerText="Phase: Alhamdulillah (33)";}} else if(tasbihMode=='hamd'){hamd++; if(hamd>=33){tasbihMode='akbar'; document.getElementById('tasbihPhase').innerText="Phase: Allahu Akbar (34)";}} else if(tasbihMode=='akbar'){akbar++; if(akbar>=34){tasbihMode='tahlil'; document.getElementById('tasbihPhase').innerText="Phase: La ilaha illAllah - Terminé"; if(navigator.vibrate) navigator.vibrate([100,50,100]);}} else{tahlil++;} document.getElementById('tasbihBtn').innerText=tasbihTotal; document.getElementById('subhanCount').innerText=subhan; document.getElementById('hamdCount').innerText=hamd; document.getElementById('akbarCount').innerText=akbar; document.getElementById('tahlilCount').innerText=tahlil; document.getElementById('tasbihTotal').innerText="Total: "+tasbihTotal+" • Subhan "+subhan+"/33 • Hamd "+hamd+"/33 • Akbar "+akbar+"/34"; if(navigator.vibrate) navigator.vibrate(40); localStorage.setItem("si_tasbih",JSON.stringify({total:tasbihTotal,subhan:subhan,hamd:hamd,akbar:akbar,tahlil:tahlil,mode:tasbihMode}));}
function resetTasbih(){tasbihTotal=0;subhan=0;hamd=0;akbar=0;tahlil=0;tasbihMode='subhan'; localStorage.removeItem("si_tasbih"); document.getElementById('tasbihBtn').innerText=0; document.getElementById('subhanCount').innerText=0; document.getElementById('hamdCount').innerText=0; document.getElementById('akbarCount').innerText=0; document.getElementById('tahlilCount').innerText=0; document.getElementById('tasbihTotal').innerText="Total: 0 • Reset"; document.getElementById('tasbihPhase').innerText="Phase: SubhanAllah (33)";}
function startQuiz(){currentQuiz=0;quizScore=0; showQuiz();}
function showQuiz(){if(currentQuiz>=quizFull.length){document.getElementById('quizContent').innerHTML="<div style='text-align:center;padding:20px'><div style='font-size:60px'>🏆</div><div style='font-size:26px;font-weight:900'>Score final: "+quizScore+"/"+quizFull.length+"</div><div class='small'>Quiz Tawhîd terminé</div></div>"; document.getElementById('quizScore').innerText="Score: "+quizScore+"/"+quizFull.length; document.getElementById('quizExplain').innerHTML="<button class='btn btn-small btn-gold' style='width:100%' onclick='startQuiz()'>Recommencer Quiz Tawhîd</button>"; return;} let q=quizFull[currentQuiz]; let html="<div style='font-weight:900;font-size:16px;margin-bottom:12px'>Q"+(currentQuiz+1)+"/"+quizFull.length+": "+q.q+"</div>"; q.a.forEach((ans,i)=>{html+="<button class='quiz-opt' onclick='answerQuiz("+i+")'>"+String.fromCharCode(65+i)+". "+ans+"</button>";}); document.getElementById('quizContent').innerHTML=html; document.getElementById('quizExplain').innerHTML="<div class='small' style='background:#f8fafc;padding:8px;border-radius:8px'>Explication: "+q.ex+"</div>";}
function answerQuiz(i){let q=quizFull[currentQuiz]; let opts=document.querySelectorAll('.quiz-opt'); opts.forEach((o,idx)=>{if(idx==q.c) o.classList.add('correct'); else if(idx==i) o.classList.add('wrong'); o.disabled=true;}); if(i==q.c){quizScore++; if(navigator.vibrate) navigator.vibrate(80);} else{if(navigator.vibrate) navigator.vibrate([50,50,50]);} document.getElementById('quizScore').innerText="Score: "+quizScore+"/"+quizFull.length; setTimeout(()=>{currentQuiz++; showQuiz();},1300);}
function askIA(){let q=document.getElementById('iaInput').value.trim().toLowerCase(); if(!q) return; let ans=""; if(q.includes('tawhid')) ans="Tawhid 3 types: Rouboubiya Allah seul Créateur Pourvoyeur, Oulouhiya adorer Allah seul sans associé, Asma wa Sifat affirmer Noms et Attributs d'Allah comme dans Coran et Sunna sans déformation."; else if(q.includes('wudu')) ans="Wudu: Niya, Bismillah, mains 3x, bouche 3x, nez 3x, visage 3x, bras 3x, tête 1x, oreilles 1x, pieds 3x."; else if(q.includes('priere')||q.includes('salat')) ans="5 prières: Fajr 2, Dhuhr 4, Asr 4, Maghreb 3, Isha 4."; else if(q.includes('jeune')||q.includes('sawm')) ans="Jeûne Ramadan: abstinence nourriture, boisson, rapport de Fajr à Maghreb avec intention."; else if(q.includes('coran')) ans="Coran 114 sourates, révélé en 23 ans, parole d'Allah incréée."; else ans="Réponse selon Coran et Sunna pour: "+q; document.getElementById('iaResponse').innerHTML="<div style='background:#ede9fe;border:1px solid #c4b5fd;border-radius:16px;padding:14px'><b>IA Islamique</b><div style='margin-top:8px;font-weight:600'>"+ans+"</div><button class='btn btn-small btn-gold' style='margin-top:10px' onclick='speakText(\""+ans.substring(0,180)+"\",\"fr\",0.9)'>Ecouter</button></div>"; speakText(ans.substring(0,180),'fr',0.9);}
function quickIA(t){document.getElementById('iaInput').value=t; askIA();}
function saveSettings(){let hijri=document.getElementById('hijriAdjust').value; let city=document.getElementById('citySelect').value; localStorage.setItem("si_hijri_adjust",hijri); localStorage.setItem("si_city",city); document.getElementById('settingsStatus').innerText="Sauvé: Hijri "+hijri+" • Ville "+city; setTimeout(()=>location.reload(),800);}
function resetSettings(){localStorage.removeItem("si_hijri_adjust"); localStorage.removeItem("si_city"); localStorage.removeItem("si_tasbih"); document.getElementById('settingsStatus').innerText="Reset effectué"; setTimeout(()=>location.reload(),600);}
function getCalendars(){let now=new Date(); let gregStr=""; let hijriStr=""; try{gregStr=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);}catch(e){gregStr=now.toLocaleDateString('fr-FR');} try{let fmt=new Intl.DateTimeFormat('fr-TN-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}); hijriStr=fmt.format(now); let adj=parseInt(localStorage.getItem("si_hijri_adjust")||"-1"); if(adj!=0){let m=hijriStr.match(/(\d+)/); if(m){let d=parseInt(m[1])+adj; hijriStr=hijriStr.replace(m[1],d.toString());}} document.getElementById('hijriDate').innerText=hijriStr+"H"; document.getElementById('gregDate').innerText=gregStr; document.getElementById('hijriFull').innerText=hijriStr+"H = "+gregStr+" • Umm Al-Qura";}catch(e){document.getElementById('hijriDate').innerText="13 Rabi al-Thani 1448H"; document.getElementById('gregDate').innerText=gregStr;}}
function updatePrayerUI(t){if(t){document.getElementById('tFajr').innerText=t.Fajr.substring(0,5); document.getElementById('tDhuhr').innerText=t.Dhuhr.substring(0,5); document.getElementById('tAsr').innerText=t.Asr.substring(0,5); document.getElementById('tMaghreb').innerText=t.Maghreb.substring(0,5); document.getElementById('tIsha').innerText=t.Isha.substring(0,5); document.getElementById('pMaghreb').innerText="Maghreb "+t.Maghreb.substring(0,5); document.getElementById('pIsha').innerText="Isha "+t.Isha.substring(0,5); currentTimings=t;}}
function fetchWeather(lat,lon){fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code&timezone=auto").then(r=>r.json()).then(d=>{if(d.current){let temp=Math.round(d.current.temperature_2m); document.getElementById('tempLocal').innerText=temp+"°C"; let code=d.current.weather_code; let desc="☀️ Ensoleillé"; if(code>2) desc="☁️ Nuageux"; if(code>50) desc="🌧️ Pluie"; if(code>70) desc="❄️ Neige"; document.getElementById('weatherDesc').innerText=desc+" • Temps réel";}}).catch(()=>{document.getElementById('tempLocal').innerText="34°C"; document.getElementById('weatherDesc').innerText="Bamako • Météo";});}
function startCountdown(){setInterval(()=>{let now=new Date(); let order=[{n:"Fajr",t:currentTimings.Fajr,card:"cardFajr"},{n:"Dhuhr",t:currentTimings.Dhuhr,card:"cardDhuhr"},{n:"Asr",t:currentTimings.Asr,card:"cardAsr"},{n:"Maghreb",t:currentTimings.Maghreb,card:"cardMaghreb"},{n:"Isha",t:currentTimings.Isha,card:"cardIsha"}]; document.querySelectorAll('.prayer-item').forEach(el=>el.classList.remove('active')); document.querySelectorAll('[id^=count]').forEach(el=>{if(el.id!='countdown') el.innerText="--";}); let nextFound=false; for(let o of order){let parts=o.t.split(':'); let h=parseInt(parts[0]),m=parseInt(parts[1]); let d=new Date(); d.setHours(h,m,0,0); if(d>now&&!nextFound){let diff=d-now; let hh=Math.floor(diff/3600000); let mm=Math.floor((diff%3600000)/60000); let ss=Math.floor((diff%60000)/1000); document.getElementById('currentPrayer').innerText=o.n; document.getElementById('currentTime').innerText=o.t.substring(0,5); document.getElementById('countdown').innerText="Dans "+hh+"h "+mm+"min "+ss+"s - "+o.n+" prochaine • "+document.getElementById('pCity').innerText.replace("📍 ",""); document.getElementById(o.card).classList.add('active'); document.getElementById('count'+o.n).innerText=hh+"h "+mm+"m "+ss+"s restant"; nextFound=true;}} if(!nextFound){let p=currentTimings.Fajr.split(':'); let d=new Date(); d.setDate(d.getDate()+1); d.setHours(parseInt(p[0]),parseInt(p[1]),0,0); let diff=d-now; let hh=Math.floor(diff/3600000); let mm=Math.floor((diff%3600000)/60000); document.getElementById('currentPrayer').innerText="Fajr demain"; document.getElementById('currentTime').innerText=currentTimings.Fajr.substring(0,5); document.getElementById('countdown').innerText="Dans "+hh+"h "+mm+"min - Fajr demain • "+document.getElementById('pCity').innerText.replace("📍 ",""); document.getElementById('cardFajr').classList.add('active'); document.getElementById('countFajr').innerText=hh+"h "+mm+"m restant";}},1000);}
function startCompass(){let status=document.getElementById('compassStatus'); if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r=='granted'){window.addEventListener('deviceorientation',handleOrientation,true); status.innerText="Active";} else{status.innerText="Refusé";}}).catch(()=>{status.innerText="Erreur";});} else{if('DeviceOrientationEvent' in window){window.addEventListener('deviceorientation',handleOrientation,true); status.innerText="Active Android";} else{status.innerText="Non supportée";}}}
function handleOrientation(e){let heading=0; if(e.webkitCompassHeading){heading=e.webkitCompassHeading;} else if(e.alpha!==null){heading=360-e.alpha;} let rel=qiblaDirection-heading; document.getElementById('compassDegree').innerText="N "+Math.round(heading)+"° • Qibla "+qiblaDirection+"°"; document.getElementById('qiblaArrow').style.transform="translate(-50%,-100%) rotate("+rel+"deg)"; document.getElementById('qiblaDegree').innerText=qiblaDirection+"° vers Kaaba • Cap "+Math.round(heading)+"° • Ecart "+Math.round(rel)+"°"; document.getElementById('qiblaDegreeMini').innerText=qiblaDirection+"°"; document.getElementById('qiblaInfo').innerText="Qibla "+qiblaDirection+"° • Cap "+Math.round(heading)+"° • Ecart "+Math.round(rel)+"°"; document.getElementById('qiblaInfoTop').innerText="Qibla "+qiblaDirection+"° • Cap "+Math.round(heading)+"°";}
function detectLocation(){getCalendars(); document.getElementById('pCity').innerText="Localisation..."; let savedCity=localStorage.getItem("si_city")||"auto"; if(savedCity!="auto"){let map={bamako:{city:"Bamako",region:"District de Bamako",country:"Mali",q:66,lat:12.6392,lon:-8.0029},kayes:{city:"Kayes",region:"Région de Kayes",country:"Mali",q:68,lat:14.44,lon:-11.43},koulikoro:{city:"Koulikoro",region:"Koulikoro",country:"Mali",q:66,lat:12.86,lon:-7.56},sikasso:{city:"Sikasso",region:"Sikasso",country:"Mali",q:64,lat:11.31,lon:-5.66},segou:{city:"Ségou",region:"Ségou",country:"Mali",q:65,lat:13.43,lon:-6.21},mopti:{city:"Mopti",region:"Mopti",country:"Mali",q:64,lat:14.48,lon:-4.19},tombouctou:{city:"Tombouctou",region:"Tombouctou",country:"Mali",q:63,lat:16.77,lon:-3.00},gao:{city:"Gao",region:"Gao",country:"Mali",q:61,lat:16.27,lon:-0.04},dakar:{city:"Dakar",region:"Dakar",country:"Sénégal",q:78,lat:14.69,lon:-17.44},abidjan:{city:"Abidjan",region:"Abidjan",country:"Côte d'Ivoire",q:64,lat:5.36,lon:-4.00},paris:{city:"Paris",region:"Île-de-France",country:"France",q:119,lat:48.85,lon:2.35}}; let s=map[savedCity]; if(s){document.getElementById('pCity').innerText="📍 "+s.city; document.getElementById('pRegion').innerText=s.region+" • "+s.country+" • Manuel"; qiblaDirection=s.q; document.getElementById('qiblaDegreeMini').innerText=s.q+"°"; document.getElementById('qiblaDegree').innerText=s.q+"° vers Kaaba • "+s.city; document.getElementById('qiblaArrow').style.transform="translate(-50%,-100%) rotate("+s.q+"deg)"; fetchWeather(s.lat,s.lon); return;}} if(!navigator.geolocation){fetchWeather(12.6392,-8.0029); document.getElementById('pCity').innerText="📍 Bamako, Commune IV"; document.getElementById('pRegion').innerText="District de Bamako • Mali • GPS désactivé"; return;} navigator.geolocation.getCurrentPosition(pos=>{let lat=pos.coords.latitude,lon=pos.coords.longitude; fetchWeather(lat,lon); fetch("https://api.aladhan.com/v1/timings/"+Math.floor(Date.now()/1000)+"?latitude="+lat+"&longitude="+lon+"&method=4").then(r=>r.json()).then(d=>{if(d.data&&d.data.timings){updatePrayerUI(d.data.timings); if(d.data.date&&d.data.date.hijri){let h=d.data.date.hijri; let adj=parseInt(localStorage.getItem("si_hijri_adjust")||"-1"); let day=parseInt(h.day)+adj; document.getElementById('hijriDate').innerText=day+" "+h.month.ar+" "+h.year+"H"; document.getElementById('hijriFull').innerText=day+" "+h.month.ar+" "+h.year+"H = "+d.data.date.readable; document.getElementById('gregDate').innerText=d.data.date.readable;}}}); fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=fr").then(r=>r.json()).then(loc=>{let city=loc.city||loc.locality||"Bamako"; let region=loc.principalSubdivision||"Bamako"; let country=loc.countryName||"Mali"; document.getElementById('pCity').innerText="📍 "+city+" - "+region; document.getElementById('pRegion').innerText=region+" • "+country+" • GPS";}); fetch("https://api.aladhan.com/v1/qibla/"+lat+"/"+lon).then(r=>r.json()).then(d=>{let deg=Math.round(d.data.direction); qiblaDirection=deg; document.getElementById('qiblaDegree').innerText=deg+"° vers Kaaba • GPS"; document.getElementById('qiblaDegreeMini').innerText=deg+"°"; document.getElementById('qiblaArrow').style.transform="translate(-50%,-100%) rotate("+deg+"deg)"; document.getElementById('qiblaInfo').innerText="Qibla "+deg+"° • GPS";});},()=>{fetchWeather(12.6392,-8.0029); document.getElementById('pCity').innerText="📍 Bamako, Commune IV"; document.getElementById('pRegion').innerText="District de Bamako • Mali • GPS refusé";},{enableHighAccuracy:true,timeout:8000});}
function handleQuranUpload(event){let file=event.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(e){try{let content=e.target.result; let data={}; if(file.name.endsWith('.json')){data=JSON.parse(content);} else{let selId=document.getElementById('surahSel').value||2; data[selId]={ar:content,fr:"";}} let count=0; Object.keys(data).forEach(k=>{let entry=data[k]; let ar=typeof entry==='string'?entry:(entry.ar||entry.arabic||""); let fr=entry.fr||entry.french||""; if(ar){if(!savedQuran[k]) savedQuran[k]={}; savedQuran[k].ar=ar; qTexts[k]=ar; count++;} if(fr){if(!savedQuran[k]) savedQuran[k]={}; savedQuran[k].fr=fr; qTextsFr[k]=fr;}}); localStorage.setItem('si_quran_user',JSON.stringify(savedQuran)); document.getElementById('uploadStatus').innerText="✅ "+count+" sourate(s) importée(s) avec numéros"; setTimeout(()=>{loadSurahs(); loadS();},800);}catch(err){document.getElementById('uploadStatus').innerText="❌ Erreur: "+err.message;}}; reader.readAsText(file);}
function downloadSurah(){let id=document.getElementById('surahSel').value||1; let f=full.find(x=>x.n==id); let ar=qTexts[id]||""; let fr=qTextsFr[id]||""; let content="Sourate "+f.n+" - "+f.name+" - "+f.ar+"\n"+f.ay+" versets\n\nARABE AVEC NUMEROS:\n"+ar+"\n\nFRANCAIS AVEC NUMEROS:\n"+fr; let blob=new Blob([content],{type:'text/plain;charset=utf-8'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download="Sourate_"+f.n+"_"+f.name+".txt"; a.click(); URL.revokeObjectURL(url);}
window.onload=function(){try{loadVoices(); if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;} loadSurahs(); newHadith(); renderDuas(); renderLetters(); getCalendars(); let savedT=JSON.parse(localStorage.getItem("si_tasbih")||"null"); if(savedT){tasbihTotal=savedT.total||0;subhan=savedT.subhan||0;hamd=savedT.hamd||0;akbar=savedT.akbar||0;tahlil=savedT.tahlil||0;tasbihMode=savedT.mode||'subhan'; document.getElementById('tasbihBtn').innerText=tasbihTotal; document.getElementById('subhanCount').innerText=subhan; document.getElementById('hamdCount').innerText=hamd; document.getElementById('akbarCount').innerText=akbar; document.getElementById('tahlilCount').innerText=tahlil; document.getElementById('tasbihTotal').innerText="Total: "+tasbihTotal+" • Restauré";} document.getElementById('hijriAdjust').value=localStorage.getItem("si_hijri_adjust")||"-1"; document.getElementById('citySelect').value=localStorage.getItem("si_city")||"auto"; updatePrayerUI(currentTimings); startCountdown(); detectLocation();}catch(e){console.error(e);}};
</script>
